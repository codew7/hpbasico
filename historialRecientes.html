<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
    <!-- Fuera de los buscadores: noindex impide que Google indexe la pagina y
         nofollow que siga sus enlaces. Debe quedar rastreable en robots.txt,
         porque si se bloquea el crawleo Google nunca lee esta etiqueta. -->
    <meta name="robots" content="noindex, nofollow">
    <meta name="googlebot" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos del Día</title>
  <link rel="icon" href="faviconnegro.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Esta pantalla NO carga styles.css: comparte lenguaje visual con
       ingresoPedidoV2.css (mismos tokens, tipografía y gestos) y esa hoja
       compartida no debe moverse por el rediseño de la caja. -->
  <!-- Firebase Auth Check -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="config.js"></script>
  <script>
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    firebase.auth().onAuthStateChanged(function(user) {
      if (!user) {
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.pathname);
      }
    });
    const db = firebase.database();
  </script>
  <!-- Fin Firebase Auth Check -->
  <!-- QZ Tray: puente local para impresión ESC-POS (fuente nativa de la 3nStar RPT008) -->
  <script src="https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js"></script>
  <script>
    let pedidosCache = {};
    // === ALIAS: Registro/lectura desde el nodo "alias" de Firebase RTDB (+ cache en localStorage) ===
    let aliasHistorial = [];      // cache offline en localStorage
    let aliasDesdeFirebase = [];  // alias registrados en el nodo "alias" de RTDB

    // Convertir un alias a una clave válida para Firebase RTDB.
    // Las claves no admiten . # $ / [ ] ; el alias original se guarda como valor.
    function aliasAClave(alias) {
      return alias.replace(/[.#$/\[\]]/g, c => '~' + c.charCodeAt(0) + '~');
    }

    function cargarHistorialAliasDesdeLocalStorage() {
      try {
        const aliasGuardados = localStorage.getItem('historialAlias');
        aliasHistorial = aliasGuardados ? JSON.parse(aliasGuardados) : [];
      } catch (error) {
        aliasHistorial = [];
      }
    }

    // Suscribirse al nodo "alias" de Firebase RTDB
    function cargarAliasDesdeFirebase() {
      try {
        db.ref('alias').on('value', snap => {
          const val = snap.val() || {};
          aliasDesdeFirebase = Object.values(val)
            .map(v => (v || '').toString().trim().toUpperCase())
            .filter(v => v !== '');
        });
      } catch (error) {
        console.error('Error cargando alias desde Firebase:', error);
      }
    }

    // Registrar un alias en el nodo "alias" de Firebase (una sola vez, sin duplicados).
    // La clave saneada garantiza unicidad: si ya existe, set lo sobrescribe sin duplicar.
    function registrarAliasEnFirebase(nuevoAlias) {
      try {
        if (!nuevoAlias || nuevoAlias.trim() === '') return;
        const aliasLimpio = nuevoAlias.trim().toUpperCase();
        db.ref('alias/' + aliasAClave(aliasLimpio)).set(aliasLimpio);
      } catch (error) {
        console.error('Error registrando alias en Firebase:', error);
      }
    }

    function guardarAliasEnLocalStorage(nuevoAlias) {
      try {
        if (!nuevoAlias || nuevoAlias.trim() === '') return;
        const aliasLimpio = nuevoAlias.trim().toUpperCase();
        // Registrar en el nodo "alias" de Firebase (fuente compartida)
        registrarAliasEnFirebase(aliasLimpio);
        let historial = [];
        const aliasGuardados = localStorage.getItem('historialAlias');
        if (aliasGuardados) historial = JSON.parse(aliasGuardados);
        historial = historial.filter(a => a !== aliasLimpio);
        historial.unshift(aliasLimpio);
        historial = historial.slice(0, 15);
        localStorage.setItem('historialAlias', JSON.stringify(historial));
        aliasHistorial = historial;
      } catch (error) {
        console.error('Error guardando alias en localStorage:', error);
      }
    }

    // Lista combinada (Firebase + cache local) sin duplicados y ordenada alfabéticamente
    function obtenerListaAlias() {
      const vistos = new Set();
      const lista = [];
      [...aliasDesdeFirebase, ...aliasHistorial].forEach(alias => {
        const a = (alias || '').trim().toUpperCase();
        if (a !== '' && !vistos.has(a)) { vistos.add(a); lista.push(a); }
      });
      lista.sort((a, b) => a.localeCompare(b, 'es'));
      return lista;
    }

    // Cargar alias al inicio
    cargarHistorialAliasDesdeLocalStorage();
    cargarAliasDesdeFirebase();

    // === MODAL WHATSAPP ===
    let whatsappPedidoId = null;

    function abrirModalWhatsapp(id) {
      whatsappPedidoId = id;
      const pedido = pedidosCache[id];
      if (!pedido) { alert('Pedido no encontrado'); return; }

      const aliasActual = (pedido.pagos && pedido.pagos.alias) ? pedido.pagos.alias.trim().toUpperCase() : '';
      document.getElementById('waAliasInput').value = aliasActual;

      const telefonoActual = (pedido.cliente && pedido.cliente.telefono) ? pedido.cliente.telefono : '';
      const telInput = document.getElementById('waTelefonoInput');
      telInput.value = telefonoActual;
      telInput.placeholder = telefonoActual ? '' : 'Ej: 11 2189-1006';

      // Poblar datalist
      const datalist = document.getElementById('waAliasDatalist');
      datalist.innerHTML = '';
      obtenerListaAlias().forEach(a => {
        const opt = document.createElement('option');
        opt.value = a;
        datalist.appendChild(opt);
      });

      document.getElementById('waModal').style.display = 'flex';
      // Si no hay teléfono, enfocar primero ese campo; si ya hay, enfocar alias
      if (!telefonoActual) telInput.focus();
      else document.getElementById('waAliasInput').focus();
    }

    function cerrarModalWhatsapp() {
      document.getElementById('waModal').style.display = 'none';
      whatsappPedidoId = null;
    }

    // Guarda alias y teléfono en Firebase + caché local. Devuelve true si OK.
    async function persistirDatosModal({ alias, telefono }) {
      if (!whatsappPedidoId) return false;
      const pedido = pedidosCache[whatsappPedidoId];
      if (!pedido) { alert('Pedido no encontrado'); return false; }

      const aliasActual = (pedido.pagos && pedido.pagos.alias) ? pedido.pagos.alias.trim().toUpperCase() : '';
      const telefonoActual = (pedido.cliente && pedido.cliente.telefono) ? pedido.cliente.telefono : '';

      const updates = {};
      if (alias !== aliasActual) updates['pedidos/' + whatsappPedidoId + '/pagos/alias'] = alias;
      if (telefono !== telefonoActual) updates['pedidos/' + whatsappPedidoId + '/cliente/telefono'] = telefono;

      if (Object.keys(updates).length === 0) return true;

      try {
        await db.ref().update(updates);
        if (!pedidosCache[whatsappPedidoId].pagos) pedidosCache[whatsappPedidoId].pagos = {};
        if (!pedidosCache[whatsappPedidoId].cliente) pedidosCache[whatsappPedidoId].cliente = {};
        if (alias) {
          pedidosCache[whatsappPedidoId].pagos.alias = alias;
          guardarAliasEnLocalStorage(alias);
        }
        pedidosCache[whatsappPedidoId].cliente.telefono = telefono;
        return true;
      } catch (e) {
        console.error('Error guardando datos del modal:', e);
        alert('Error al guardar en Firebase');
        return false;
      }
    }

    async function guardarDatosModal() {
      if (!whatsappPedidoId) return;
      const aliasInput = document.getElementById('waAliasInput').value.trim().toUpperCase();
      const telefonoInput = document.getElementById('waTelefonoInput').value.trim();

      if (!aliasInput && !telefonoInput) {
        alert('Debe ingresar al menos un alias o un teléfono');
        return;
      }

      const ok = await persistirDatosModal({ alias: aliasInput, telefono: telefonoInput });
      if (ok) {
        const btn = document.getElementById('waBtnGuardar');
        const txtOriginal = btn.innerHTML;
        btn.innerHTML = '✓ Guardado';
        btn.disabled = true;
        setTimeout(() => {
          btn.innerHTML = txtOriginal;
          btn.disabled = false;
          cerrarModalWhatsapp();
        }, 700);
      }
    }

    async function enviarWhatsapp() {
      if (!whatsappPedidoId) return;

      const aliasInput = document.getElementById('waAliasInput').value.trim().toUpperCase();
      if (!aliasInput) { alert('Debe ingresar un alias'); return; }

      const telefonoInput = document.getElementById('waTelefonoInput').value.trim();
      const telefonoDigits = telefonoInput.replace(/\D/g, '');
      if (!telefonoDigits) { alert('Debe ingresar un teléfono'); return; }

      const ok = await persistirDatosModal({ alias: aliasInput, telefono: telefonoInput });
      if (!ok) return;

      // Formatear teléfono: asegurar prefijo 54 para Argentina
      let tel = telefonoDigits;
      if (!tel.startsWith('54')) tel = '54' + tel;

      const url = `https://api.whatsapp.com/send/?phone=${tel}&text=${encodeURIComponent(aliasInput)}`;
      window.open(url, '_blank');
      cerrarModalWhatsapp();
    }

    document.addEventListener('DOMContentLoaded', function() {
      // Calcular fecha de hoy en Argentina (UTC-3) antes de armar la query
      const now = new Date();
      const argentinaTime = new Date(now.getTime() - (3 * 60 * 60 * 1000));
      const fechaHoy = argentinaTime.toISOString().split('T')[0]; // YYYY-MM-DD

      // Query optimizada: solo descarga registros del día de hoy desde Firebase.
      // orderByChild('fecha') con startAt/endAt limita los datos en el servidor.
      // createdby = admin se filtra en cliente (no requiere descarga extra).
      db.ref('pedidos')
        .orderByChild('fecha')
        .startAt(fechaHoy)
        .endAt(fechaHoy + '\uf8ff')
        .on('value', snap => {
          pedidosCache = {};
          snap.forEach(child => {
            const val = child.val();
            if (val.createdby === 'admin') {
              pedidosCache[child.key] = val;
            }
          });
          renderPedidos();
        });

      // Permitir aplicar filtros con Enter en los campos de filtro
      document.getElementById('filtroNombre').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') aplicarFiltros();
      });

      // Doble clic sobre un medio del desglose = ver solo esos pagos. El
      // listener va en el contenedor porque los ítems se redibujan en cada
      // render. Enter/Espacio hacen lo mismo para quien navega con teclado.
      const desglose = document.getElementById('hdrDesglose');
      if (desglose) {
        desglose.addEventListener('dblclick', function(e) {
          const item = e.target.closest('.medio-item');
          if (item) toggleFiltroMedio(item.dataset.medio);
        });
        desglose.addEventListener('keydown', function(e) {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          const item = e.target.closest('.medio-item');
          if (!item) return;
          e.preventDefault();
          toggleFiltroMedio(item.dataset.medio);
        });
      }
    });

    // === PAGINACIÓN ===
    // Los pedidos del día ya vienen descargados y filtrados (fecha de hoy +
    // createdby = admin). La paginación es 100% en cliente: solo se renderizan
    // 30 filas por página, evitando construir cientos de nodos del DOM de una.
    const PAGE_SIZE = 30;
    let paginaActual = 1;
    // Filtro por medio de pago (slug), lo activa el doble clic en el desglose
    // de la cabecera. Vacío = sin filtro.
    let filtroMedio = '';

    function toggleFiltroMedio(slug) {
      if (!slug) return;
      // Volver a marcar el mismo medio lo apaga: el doble clic es un interruptor.
      filtroMedio = (filtroMedio === slug) ? '' : slug;
      paginaActual = 1;
      renderPedidos();
    }

    function renderPedidos() {
      const tbody = document.getElementById('pedidosBody');
      const pedidos = pedidosCache;
      const filtroNombre = document.getElementById('filtroNombre').value.trim().toLowerCase();

      // Los registros ya vienen filtrados por fecha de hoy y createdby = admin desde Firebase
      let keys = Object.keys(pedidos).reverse();

      renderIndicadores(keys);

      if (filtroNombre) {
        keys = keys.filter(id => (pedidos[id].cliente?.nombre || '').toLowerCase().includes(filtroNombre));
      }

      if (filtroMedio) {
        keys = keys.filter(id => slugMedio((pedidos[id].pagos || {}).medioPago) === filtroMedio);
      }

      const totalRegistros = keys.length;
      const totalPaginas = Math.max(1, Math.ceil(totalRegistros / PAGE_SIZE));
      // Mantener la página dentro de rango (p. ej. si llegaron/cancelaron pedidos en vivo)
      if (paginaActual > totalPaginas) paginaActual = totalPaginas;
      if (paginaActual < 1) paginaActual = 1;

      if (totalRegistros === 0) {
        tbody.innerHTML = '<tr><td colspan="7" class="tabla-vacia">No hay pedidos del día de hoy que coincidan con los filtros.</td></tr>';
        renderPaginacion(0, 1, 1);
        return;
      }

      const inicio = (paginaActual - 1) * PAGE_SIZE;
      const keysPagina = keys.slice(inicio, inicio + PAGE_SIZE);

      // Render optimizado: se arma un array de filas y se asigna innerHTML una
      // sola vez (un único reflow), en lugar de reconcatenar innerHTML por fila.
      const filas = keysPagina.map(id => {
        const p = pedidos[id];
        const cliente = p.cliente || {};
        const vendedor = p.vendedor || 'No asignado';
        const isCancelado = (p.status || '').toUpperCase() === 'CANCELADO';
        const pagos = p.pagos || {};
        // Todas las filas son del día de hoy: la hora es el dato que ordena la
        // lectura; la fecha queda como línea secundaria para no perder contexto.
        const hora = p.timestamp
          ? new Date(p.timestamp).toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit', hour12: false })
          : '—';
        // p.fecha puede traer la hora pegada ('2026-08-26 14:32:05'): se corta
        // el sello de tiempo para que la celda no arme un tercer renglón.
        const fechaSolo = String(p.fecha || '').trim().split(/[ T]/)[0];
        // totalFinal y subtotal pueden ser string o number, se fuerza a number si es posible
        const totalFinal = pagos.totalFinal !== undefined ? `$${Number(pagos.totalFinal).toLocaleString('es-AR', {maximumFractionDigits:0})}` : '';
        const medioPagoNorm = (pagos.medioPago || '').toString().trim().toLowerCase();
        // Slug sin acentos para la clase del chip (débito -> debito)
        const medioPagoSlug = medioPagoNorm.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');
        const waHabilitado = medioPagoNorm === 'transferencia' || medioPagoNorm === 'parcial';
        // La calculadora de vuelto solo tiene sentido cobrando en efectivo
        const calcHabilitado = medioPagoNorm === 'efectivo';
        return `
          <tr${isCancelado ? ' class="row-cancelado"' : ''}>
            <td class="col-hora"><span class="hora">${hora}</span><span class="fecha-sub">${fechaSolo}</span></td>
            <td>
              <button type="button" class="link-cliente" onclick="verPedido('${id}')" title="Abrir pedido">${cliente.nombre || 'Sin nombre'}</button>
              ${isCancelado ? '<span class="badge-cancelado">Cancelado</span>' : ''}
            </td>
            <td class="col-nota"><span class="nota-txt">${p.nota || ''}</span></td>
            <td class="col-total">${totalFinal}</td>
            <td>${pagos.medioPago ? `<span class="chip-pago chip-pago--${medioPagoSlug}">${pagos.medioPago}</span>` : ''}</td>
            <td class="col-vendedor">${vendedor}</td>
            <td>
              <div class="acciones">
              <button class="icon-btn icon-btn--wa" onclick="abrirModalWhatsapp('${id}')" title="${waHabilitado ? 'Enviar alias por WhatsApp' : 'Solo disponible para pagos por transferencia o parcial'}" aria-label="WhatsApp"${waHabilitado ? '' : ' disabled'}><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.116.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.116-.198-.012-.304.087-.403.089-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.325-.336-.445-.342-.116-.007-.248-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.13 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.116-.943-.05-.084-.182-.133-.38-.232z"/></svg></button>
              <button class="icon-btn icon-btn--calc" onclick="abrirCalcCobro('${id}')" title="${calcHabilitado ? 'Calculadora de cobro' : 'Solo disponible para pagos en efectivo'}" aria-label="Calculadora de cobro"${calcHabilitado ? '' : ' disabled'}><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6"/><path d="M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15h.01M9 19h.01M12 19h.01M15 19h.01"/></svg></button>
              <button class="icon-btn icon-btn--ver" onclick="verPedido('${id}')" title="Ver pedido" aria-label="Ver pedido"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/><path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/></svg></button>
              <button class="icon-btn icon-btn--print" onclick="imprimirPedido('${id}')" title="Imprimir ticket" aria-label="Imprimir"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2.5 8a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1z"/><path d="M5 1a2 2 0 0 0-2 2v2H2a2 2 0 0 0-2 2v3a2 2 0 0 0 2 2h1v1a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-1h1a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-1V3a2 2 0 0 0-2-2H5zM4 3a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2H4V3zm1 10a1 1 0 0 1-1-1V9h8v3a1 1 0 0 1-1 1H5z"/></svg></button>
              <button class="icon-btn icon-btn--danger" onclick="cancelarPedido('${id}')" title="${isCancelado ? 'El pedido ya está cancelado' : 'Cancelar pedido'}" aria-label="Cancelar pedido"${isCancelado ? ' disabled' : ''}><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M4.646 4.646a.5.5 0 0 1 .708 0L8 7.293l2.646-2.647a.5.5 0 0 1 .708.708L8.707 8l2.647 2.646a.5.5 0 0 1-.708.708L8 8.707l-2.646 2.647a.5.5 0 0 1-.708-.708L7.293 8 4.646 5.354a.5.5 0 0 1 0-.708z"/><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8z"/></svg></button>
              </div>
            </td>
          </tr>
        `;
      });
      tbody.innerHTML = filas.join('');

      renderPaginacion(totalRegistros, paginaActual, totalPaginas);
    }

    // Pulso del día en la cabecera: cantidad de pedidos vigentes y lo facturado.
    // Se calcula sobre todos los pedidos descargados (no sobre el filtro) y
    // deja fuera los cancelados, que no suman al total del día.
    // Orden fijo del desglose: el cajero busca siempre en el mismo lugar.
    const ORDEN_MEDIOS = ['efectivo', 'transferencia', 'debito', 'credito', 'parcial', 'sincargo'];

    // Slug sin acentos ni espacios (Débito -> debito, "Sin cargo" -> sincargo)
    function slugMedio(txt) {
      return (txt || '').toString().normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .toLowerCase()
        .replace(/[^a-z]/g, '');
    }

    // totalFinal puede venir number o string en formato es-AR
    function montoPedido(pagos) {
      const bruto = (pagos || {}).totalFinal;
      const n = typeof bruto === 'number'
        ? bruto
        : parseFloat(String(bruto || '').replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.'));
      return isNaN(n) ? 0 : n;
    }

    const pesos = (n) => '$' + Math.round(n).toLocaleString('es-AR');

    function renderIndicadores(keys) {
      const elPedidos = document.getElementById('hdrPedidos');
      const elFacturado = document.getElementById('hdrFacturado');
      const elDesglose = document.getElementById('hdrDesglose');
      if (!elPedidos || !elFacturado) return;

      let vigentes = 0;
      let facturado = 0;
      // clave = slug del medio; conserva la etiqueta tal cual la guardó el pedido
      const porMedio = new Map();

      keys.forEach(id => {
        const p = pedidosCache[id] || {};
        if ((p.status || '').toUpperCase() === 'CANCELADO') return;
        vigentes++;
        const monto = montoPedido(p.pagos);
        facturado += monto;

        const etiqueta = ((p.pagos || {}).medioPago || '').toString().trim() || 'Sin especificar';
        const slug = slugMedio(etiqueta) || 'otro';
        const acum = porMedio.get(slug) || { etiqueta: etiqueta, monto: 0, pedidos: 0 };
        acum.monto += monto;
        acum.pedidos++;
        porMedio.set(slug, acum);
      });

      elPedidos.textContent = vigentes;
      elFacturado.textContent = pesos(facturado);

      if (!elDesglose) return;
      const filas = [...porMedio.entries()]
        .filter(([, v]) => Math.round(v.monto) !== 0)
        .sort((a, b) => {
          const ia = ORDEN_MEDIOS.indexOf(a[0]);
          const ib = ORDEN_MEDIOS.indexOf(b[0]);
          if (ia !== ib) return (ia === -1 ? 99 : ia) - (ib === -1 ? 99 : ib);
          return b[1].monto - a[1].monto;
        });

      elDesglose.innerHTML = filas.map(([slug, v]) => {
        const plural = v.pedidos === 1 ? 'pedido' : 'pedidos';
        const activo = filtroMedio === slug;
        const ayuda = activo
          ? `Doble clic para quitar el filtro · ${v.pedidos} ${plural}`
          : `Doble clic para ver solo ${v.etiqueta} · ${v.pedidos} ${plural}`;

               `<span class="medio-label">${v.etiqueta}</span>` +
               `<span class="medio-valor">${pesos(v.monto)}</span></button>`;
      }).join('');

    // Dibuja la barra de paginación (info + botones anterior/siguiente)
    function renderPaginacion(totalRegistros, pagina, totalPaginas) {
      const cont = document.getElementById('paginacion');

      if (totalRegistros === 0) {
        cont.innerHTML = '';
        return;
      }
      const desde = (pagina - 1) * PAGE_SIZE + 1;
      const hasta = Math.min(pagina * PAGE_SIZE, totalRegistros);
      const prevDisabled = pagina <= 1;
      const nextDisabled = pagina >= totalPaginas;
      cont.innerHTML = `
        <span class="paginacion-info">Mostrando ${desde}-${hasta} de ${totalRegistros}</span>
        <div class="paginacion-nav">
          <button type="button" class="secondary" onclick="paginaAnterior()"${prevDisabled ? ' disabled' : ''}>‹ Anterior</button>
          <span class="paginacion-pag">Página ${pagina} de ${totalPaginas}</span>
          <button type="button" class="secondary" onclick="paginaSiguiente()"${nextDisabled ? ' disabled' : ''}>Siguiente ›</button>

    // ====================================================================
    // IMPRESIÓN ESC-POS (fuente nativa FONTA de la 3nStar RPT008 vía QZ Tray)
    // ====================================================================
    // El navegador no puede mandar bytes ESC-POS por window.print() (siempre
    // rasteriza). QZ Tray es una app local que recibe la orden desde la web y
    // envía texto crudo a la impresora, que lo dibuja con su generador interno
    // FONTA: nítido y definido, no un mapa de bits.

    // Nombre exacto de la impresora como figura en Windows.
    // null = usar la impresora por defecto del sistema.
    const POS_PRINTER_NAME = 'POS-80C';

    // Ancho de línea de FONTA a 72 mm según el selftest: 48 caracteres.
    const POS_COLS = 48;

    // Normaliza a ASCII/PC437 (Page0, code page por defecto de la impresora):
    // sin esto, acentos y ñ saldrían como basura en modo texto.
    function posPlain(val) {
      if (val === null || val === undefined) return '';
      return String(val)
        .normalize('NFD')
        .replace(/[̀-ͯ]/g, '')
        .replace(/[¿¡]/g, '')
        .replace(/[^\x00-\x7F]/g, '');
    }

    // Helpers de formato a 48 columnas
    function posSep() { return '-'.repeat(POS_COLS) + '\n'; }

    function posFila(izq, der) {
      izq = posPlain(izq); der = posPlain(der);
      const espacio = POS_COLS - izq.length - der.length;
      if (espacio < 1) {
        izq = izq.slice(0, Math.max(0, POS_COLS - der.length - 1));
        return izq + ' ' + der + '\n';
      }
      return izq + ' '.repeat(espacio) + der + '\n';
    }

    function posWrap(texto) {
      texto = posPlain(texto);
      let out = '';
      while (texto.length > POS_COLS) {
        out += texto.slice(0, POS_COLS) + '\n';
        texto = texto.slice(POS_COLS);
      }
      return out + texto + '\n';
    }

    // Comandos ESC-POS como bytes hex / texto plano (formato que entiende QZ)
    const escCmd = (hex) => ({ type: 'raw', format: 'hex', data: hex });
    const escTxt = (s) => ({ type: 'raw', format: 'plain', data: s });

    // Construye el documento ESC-POS completo del recibo.
    // conLogo=false omite la imagen (el logo es lo único raster; si la
    // impresora/QZ no lo puede procesar, igual sale todo el texto nativo).
    function construirESCPOS(pedido, conLogo, id) {
      const cliente = pedido.cliente || {};
      const nombre = cliente.nombre || '';
      const telefono = cliente.telefono || '';
      const pagos = pedido.pagos || {};
      const medioPago = pagos.medioPago || '';

      const parseNum = (val) => {
        if (val === null || val === undefined || val === '') return NaN;
        if (typeof val === 'number') return val;
        const clean = String(val).replace(/[^\d,.-]/g, '');
        return parseFloat(clean.replace(/\./g, '').replace(',', '.'));
      };
      const soloEntero = (val) => {
        if (val === null || val === undefined || val === '') return '';
        const n = parseNum(val);
        if (isNaN(n)) return String(val);
        return Math.round(n).toLocaleString('es-AR', { maximumFractionDigits: 0 });
      };
      const ultimos5BC = (cb) => {
        if (!cb) return '';
        return String(cb).split(',').map(s => s.replace(/\D/g, '').slice(-5)).filter(Boolean).join(' ');
      };

      const data = [];
      data.push(escCmd('1B40'));   // ESC @  -> reset
      data.push(escCmd('1B7400')); // ESC t 0 -> code page PC437 (Page0)
      data.push(escCmd('1B5200')); // ESC R 0 -> juego de caracteres USA

      // Encabezado centrado
      data.push(escCmd('1B6101')); // centrar
      if (conLogo) {
        // Logo: única parte raster. Si QZ/impresora no lo procesa, se
        // reintenta sin logo (ver imprimirReciboESCPOS) y el texto igual sale.
        try {
          const logoUrl = new URL('logo.png', window.location.href).href;
          data.push({ type: 'raw', format: 'image', flavor: 'file', data: logoUrl,
                      options: { language: 'ESCPOS', dotDensity: 'double' } });
          data.push(escTxt('\n'));
        } catch (e) { /* sin logo, el ticket igual sale */ }
      } else {
        // Sin logo: nombre del local como texto nativo (doble alto/ancho)
        data.push(escCmd('1D2111')); // GS ! 0x11 -> doble alto y ancho
        data.push(escTxt('HOMEPOINT\n'));
        data.push(escCmd('1D2100')); // GS ! 0x00 -> tamaño normal
      }
      data.push(escTxt('\n'));
      data.push(escTxt('Velez Sarsfield 4127, Munro\n'));
      data.push(escTxt('Tel. 11 2189-1006\n'));
      data.push(escTxt('\n')); // línea en blanco antes del título
      data.push(escCmd('1B4501')); // negrita on
      data.push(escTxt('PRESUPUESTO\n'));
      data.push(escCmd('1B4500')); // negrita off
      data.push(escTxt(posPlain(new Date(pedido.timestamp).toLocaleString('es-AR', { hour12: false })) + '\n'));

      // Cuerpo alineado a la izquierda
      data.push(escCmd('1B6100'));
      data.push(escTxt(posSep()));
      data.push(escTxt(posWrap('Nombre: ' + nombre)));
      data.push(escTxt(posWrap('Telefono: ' + telefono)));
      data.push(escTxt(posSep()));

      if (pedido.items && Array.isArray(pedido.items)) {
        pedido.items.forEach(it => {
          const cant = it.cantidad || 0;
          const vU = it.valorU || 0;
          const vTotal = cant * vU;
          const bc = ultimos5BC(it.codigoBarras);
          data.push(escCmd('1B4501'));
          data.push(escTxt(posWrap((it.nombre || '').toUpperCase())));
          data.push(escCmd('1B4500'));
          data.push(escTxt(posFila(cant + ' x ' + soloEntero(vU), soloEntero(vTotal))));
          data.push(escTxt(posWrap('COD.' + (it.codigo || '') + (bc ? ' - ' + bc : ''))));
        });
      }

      data.push(escTxt(posSep()));
      data.push(escTxt(posFila('Subtotal', soloEntero(pagos.subtotal))));
      data.push(escTxt(posFila('Medio de Pago', medioPago)));
      if (parseNum(pagos.recargo)) data.push(escTxt(posFila('Recargo', soloEntero(pagos.recargo))));
      if (parseNum(pagos.descuento)) data.push(escTxt(posFila('Descuento', soloEntero(pagos.descuento))));
      if (parseNum(pagos.envio)) data.push(escTxt(posFila('Costo de Envio', soloEntero(pagos.envio))));
      data.push(escCmd('1B4501'));
      data.push(escTxt(posFila('TOTAL', '$ ' + soloEntero(pagos.totalFinal))));
      data.push(escCmd('1B4500'));

      data.push(escTxt(posSep()));
      data.push(escCmd('1B6101')); // centrar leyenda
      data.push(escCmd('1B4501'));
      data.push(escTxt(posWrap('- DOCUMENTO NO VALIDO COMO FACTURA -')));
      data.push(escCmd('1B4500'));

      // ID de pedido (últimos 8 caracteres en mayúscula), discreto y centrado al pie del ticket
      if (id) {
        data.push(escTxt('\n'));
        data.push(escTxt(posWrap(String(id).slice(-8).toUpperCase())));
      }

      data.push(escTxt('\n\n\n'));
      data.push(escCmd('1D564203')); // GS V 66 3 -> avanza y corta (parcial)
      return data;
    }

    async function conectarQZ() {
      if (typeof qz === 'undefined') throw new Error('La librería de QZ Tray no se cargó');
      configurarQZ();
      if (qz.websocket.isActive()) return;
      await qz.websocket.connect();
    }

    async function seleccionarImpresoraPOS() {
      if (POS_PRINTER_NAME) return POS_PRINTER_NAME;
      let lista = await qz.printers.find();
      if (!Array.isArray(lista)) lista = [lista];
      const m = lista.find(n => /3n[\s-]?star|rpt[\s-]?008|pos[\s-]?80|thermal|ticket/i.test(n));
      if (m) return m;
      return await qz.printers.getDefault();
    }

    async function imprimirReciboESCPOS(pedido, id) {
      await conectarQZ();
      const printerName = await seleccionarImpresoraPOS();
      if (!printerName) throw new Error('No se encontró ninguna impresora');
      const config = qz.configs.create(printerName, { encoding: 'CP437' });
      try {
        // Intento 1: con logo (imagen raster)
        await qz.print(config, construirESCPOS(pedido, true, id));
      } catch (eLogo) {
        // Intento 2: sin logo (solo texto nativo). Si esto también falla,
        // se propaga el error y el llamador ofrece el respaldo HTML.
        console.warn('Print con logo falló, reintentando sin logo:', eLogo);
        await qz.print(config, construirESCPOS(pedido, false, id));
      }
    }

    async function imprimirPedido(id) {
      // Usar caché local: el pedido ya fue descargado, no se hace otro fetch a Firebase
      const pedido = pedidosCache[id];
      if (!pedido) {
        alert('Pedido no encontrado');
        return;
      }
      try {
        // Camino principal: modo texto ESC-POS con la fuente nativa FONTA
        await imprimirReciboESCPOS(pedido, id);
      } catch (e) {
        // El fallback NO es silencioso: mostramos el motivo real para poder
        // diagnosticar por qué no entró el modo ESC-POS.
        console.error('Fallo impresión ESC-POS:', e);
        let motivo = (e && e.message) ? e.message : String(e);
        if (typeof qz === 'undefined') {
          motivo = 'La librería de QZ Tray no se cargó (¿sin internet o CDN bloqueado?).';
        } else if (!qz.websocket.isActive()) {
          motivo = 'No se pudo conectar con QZ Tray. Verificá que QZ Tray esté instalado y CORRIENDO (ícono en la bandeja del sistema).\n\nDetalle técnico: ' + motivo;
        }
        const usarHTML = confirm(
          'No se pudo imprimir en modo ESC-POS (fuente nativa).\n\n' +
          motivo + '\n\n' +
          '¿Querés imprimir con el método HTML de respaldo (menos nítido)?'
        );
        if (usarHTML) generarReciboYImprimir(pedido, id);
      }
    }
    
    function generarReciboYImprimir(pedido, id) {
      // Obtener datos del pedido
      const cliente = pedido.cliente || {};
      const nombre = cliente.nombre || '';
      const telefono = cliente.telefono || '';
      const pagos = pedido.pagos || {};
      const medioPago = pagos.medioPago || '';
      const subtotal = pagos.subtotal;
      const recargo = pagos.recargo;
      const descuento = pagos.descuento;
      const envio = pagos.envio;
      const totalFinal = pagos.totalFinal;

      // Helper: parsea cualquier valor a número (soporta formato es-AR)
      const parseNum = (val) => {
        if (val === null || val === undefined || val === '') return NaN;
        if (typeof val === 'number') return val;
        const clean = String(val).replace(/[^\d,.-]/g, '');
        // Formato es-AR: '.' separador de miles, ',' decimal
        return parseFloat(clean.replace(/\./g, '').replace(',', '.'));
      };

      // Helper: convierte cualquier valor a entero formateado es-AR (sin decimales)
      const soloEntero = (val) => {
        if (val === null || val === undefined || val === '') return '';
        const n = parseNum(val);
        if (isNaN(n)) return String(val);
        return Math.round(n).toLocaleString('es-AR', { maximumFractionDigits: 0 });
      };

      // Helper: últimos 5 dígitos de cada código de barras asignado
      const ultimos5BC = (cb) => {
        if (!cb) return '';
        return String(cb)
          .split(',')
          .map(s => s.replace(/\D/g, '').slice(-5))
          .filter(Boolean)
          .join(' ');
      };

      // Helper: normaliza texto para la impresora POS 3nStar RPT008.
      // Su code page por defecto es Page0 (PC437 Std.Europe), que NO incluye
      // á é í ó ú ñ ü ¿ ¡. Sin esta normalización los acentos saldrían como
      // caracteres basura en el ticket. Se descomponen los diacríticos (NFD),
      // se eliminan las marcas combinantes y se descarta cualquier byte no ASCII.
      const posText = (val) => {
        if (val === null || val === undefined) return '';
        return String(val)
          .normalize('NFD')
          .replace(/[̀-ͯ]/g, '')
          .replace(/¿|¡/g, '')
          .replace(/[^\x00-\x7F]/g, '');
      };

      // Items en formato ticket
      let itemsHtml = '';
      if (pedido.items && Array.isArray(pedido.items)) {
        pedido.items.forEach(it => {
          const cant = it.cantidad || 0;
          const vU = it.valorU || 0;
          const vTotal = cant * vU;
          const bc = ultimos5BC(it.codigoBarras);
          itemsHtml += `
            <div class="item">
              <div class="item-nombre">${(it.nombre || '').toUpperCase()}</div>
              <div class="item-linea">

    // === ACTUALIZACIÓN DE STOCK EN TIEMPO REAL ===
    /**
     * Actualiza el stock de un artículo usando transacciones de Firebase para garantizar atomicidad.
     * @param {string} codigo - Código del artículo
     * @param {string} nombre - Nombre del artículo
     * @param {number} cantidad - Cantidad a modificar
     * @param {string} tipo - Tipo de movimiento: 'ENTRADA', 'SALIDA', 'RETIRO'
     */
    async function actualizarStock(codigo, nombre, cantidad, tipo) {
      if (!codigo || !nombre || !cantidad) return;
      
      const stockRef = db.ref('stock/' + codigo);
      
      try {
        await stockRef.transaction(function(currentData) {
          // Si no existe data previa, crear objeto base
          if (currentData === null) {
            currentData = {
              nombre: nombre,
              stockActual: 0
            };
          }
          
          let stockActual = currentData.stockActual || 0;
          
          // Calcular nuevo stock según tipo de movimiento
          if (tipo === 'ENTRADA') {
            stockActual += cantidad;
          } else if (tipo === 'SALIDA' || tipo === 'RETIRO') {
            stockActual -= cantidad;
          }
          
          // Stock mínimo es 0
          stockActual = Math.max(0, stockActual);
          
          // Preservar todos los campos existentes y solo actualizar stockActual
          return {
            ...currentData,
            nombre: nombre,
            stockActual: stockActual
          };
        });
      } catch (error) {
        console.error('Error actualizando stock:', error, { codigo, nombre, cantidad, tipo });
      }
    }
    
    async function cancelarPedido(id) {
      const clave = prompt('Ingrese la contraseña para cancelar el pedido:');
      if (clave === null) return;
      if (clave !== '2574') { alert('Contraseña incorrecta'); return; }
      if (!confirm('¿Seguro que desea cancelar este pedido? Esta acción es IRREVERSIBLE y el pedido no podrá ser modificado ni reactivado.')) return;
      
      try {
        // Primero obtener los movimientos antes de eliminarlos
        const movimientosSnap = await db.ref('movimientos').orderByChild('pedidoId').equalTo(id).once('value');
        const movimientos = movimientosSnap.val();
        
        // Restaurar stock solo si hay movimientos de SALIDA
        if (movimientos) {
          const movimientosArray = Object.values(movimientos);
          const movimientosSalida = movimientosArray.filter(mov => mov.tipo === 'SALIDA');
          
          if (movimientosSalida.length > 0) {
            // Restaurar stock sumando las cantidades que se habían restado
            for (const mov of movimientosSalida) {
              if (mov.codigo && mov.nombre && mov.cantidad) {
                // Restaurar sumando la cantidad (revertir la SALIDA)
                await actualizarStock(mov.codigo, mov.nombre, mov.cantidad, 'ENTRADA');
              }
            }
          }
          
          // Eliminar los movimientos
          const updates = {};
          Object.keys(movimientos).forEach(key => {
            updates[key] = null;
          });
          await db.ref('movimientos').update(updates);
        }
        
        // Actualizar el pedido como cancelado
        await db.ref('pedidos/' + id).update({ 
          status: 'CANCELADO', 
          locked: true, 
          movimientosRegistrados: false 
        });
        
        alert('Pedido cancelado. Ya no podrá ser modificado. Los movimientos asociados han sido eliminados y el stock ha sido restaurado.');
      } catch (e) {
        console.error('Error al cancelar pedido:', e);
        alert('Error al cancelar o eliminar movimientos');
      }
    }
  </script>

      --s5: 20px; --s6: 24px; --s7: 32px;

    /* Desglose por medio de pago: es un dato de apoyo, no un tablero. Usa la

    .hdr-desglose {

       altura de la fila y romper el barrido vertical de la lista. */
    .col-nota { color: var(--ink-4); font-size: 13px; }
    /* El recorte a dos renglones va en un span interno: aplicado sobre el <td>
       reemplazaría su display:table-cell y descolocaría la celda entera. */
    .nota-txt {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
      line-height: 1.35;
    }

    .col-total { text-align: right; font-weight: 600; color: var(--ink); white-space: nowrap; }

    .col-vendedor { color: var(--ink-3); font-size: 13.5px; white-space: nowrap;
                    overflow: hidden; text-overflow: ellipsis; }

    /* ---------------------------------------------------- chip medio pago -- */
    .chip-pago {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--surface-2);
      font-size: 11.5px; font-weight: 600; letter-spacing: .01em;
      color: var(--ink-3); white-space: nowrap;
    }
    .chip-pago--efectivo      { background: var(--verde-bg);   border-color: var(--verde-line);   color: var(--verde); }
    .chip-pago--transferencia { background: var(--violeta-soft); border-color: var(--violeta-line); color: var(--violeta); }
    .chip-pago--debito,
    .chip-pago--credito       { background: var(--azul-bg);    border-color: var(--azul-line);    color: var(--azul); }
    .chip-pago--parcial       { background: var(--ambar-bg);   border-color: var(--ambar-line);   color: var(--ambar); }

    /* ----------------------------------------------- botones de la fila -- */
    .acciones { display: flex; align-items: center; justify-content: flex-end; gap: 7px; }

    .icon-btn {
      width: 36px; height: 36px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; margin: 0;
      background: var(--surface);
      color: var(--ink-3);
      border: 1px solid var(--line);
      border-radius: var(--r1);
      cursor: pointer;
    }
    .icon-btn svg { width: 16px; height: 16px; display: block; }
    .icon-btn:active:not(:disabled) { transform: scale(.94); }
    /* Deshabilitado se neutraliza del todo: un color lavado se sigue leyendo
       como acción disponible. */
    .icon-btn:disabled {
      background: var(--surface-2); border-color: var(--line-2);
      color: var(--ink-5); cursor: not-allowed;
    }

    /* Cada acción tiene su color EN REPOSO: en una lista larga el ícono solo no
       alcanza, el color es lo que se reconoce de un vistazo. El hover satura. */
    .icon-btn--wa     { background: var(--wa-bg);        border-color: var(--wa-line);      color: var(--wa); }
    .icon-btn--calc   { background: var(--violeta-soft); border-color: var(--violeta-line); color: var(--violeta); }
    .icon-btn--ver    { background: var(--azul-bg);      border-color: var(--azul-line);    color: var(--azul); }
    .icon-btn--print  { background: var(--line-3);       border-color: #e2e5ea;             color: var(--ink-2); }
    .icon-btn--danger { background: var(--rojo-bg);      border-color: var(--rojo-line);    color: var(--rojo); }

    .icon-btn--wa:hover:not(:disabled)     { background: #25D366;        border-color: #25D366;        color: #fff; }
    .icon-btn--calc:hover:not(:disabled)   { background: var(--violeta); border-color: var(--violeta); color: #fff; }
    .icon-btn--ver:hover:not(:disabled)    { background: var(--azul);    border-color: var(--azul);    color: #fff; }
    .icon-btn--print:hover:not(:disabled)  { background: var(--ink-2);   border-color: var(--ink-2);   color: #fff; }
    .icon-btn--danger:hover:not(:disabled) { background: var(--rojo);    border-color: var(--rojo);    color: #fff; }

    /* -------------------------------------------------------- paginación -- */
    .paginacion {
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: var(--s3);
    }
    .paginacion:empty { display: none; }
    .paginacion-info { font-size: 13px; color: var(--ink-4); }
    .paginacion-nav { display: flex; align-items: center; gap: var(--s2); }
    .paginacion-nav .secondary { min-height: var(--h-sm); padding: 0 var(--s3); }
    .paginacion-pag { font-size: 13px; color: var(--ink-3); font-weight: 500; padding: 0 var(--s1); }

    /* ------------------------------------------------------------ modales -- */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(16, 18, 22, .55);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      z-index: 10000;
      align-items: center; justify-content: center;
      padding: var(--s4);
    }
    .modal-card {
      background: var(--surface);
      border-radius: 16px;
      padding: var(--s7);
      width: 100%; max-width: 380px;
      box-shadow: var(--shadow-modal);
      animation: fadeInUp var(--t-slow) ease forwards;
    }
    .modal-card-ancha { max-width: 420px; }

    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      gap: var(--s3); margin-bottom: var(--s5);
    }
    .modal-titulo {
      margin: 0;
      font-size: 18px; font-weight: 700; letter-spacing: -.015em; color: var(--ink);
      display: flex; align-items: center; gap: var(--s2);
    }
    .modal-cerrar {
      background: none; border: none; padding: 0; margin: 0;
      width: 28px; height: 28px; border-radius: var(--r1);
      font-size: 22px; line-height: 1; color: var(--ink-4); cursor: pointer;
    }
    .modal-cerrar:hover { background: var(--line-3); color: var(--ink-2); }

    .modal-campo { margin-bottom: var(--s4); }
    .modal-label {
      display: block;
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-4); margin-bottom: var(--s2);
    }
    .modal-input {
      width: 100%;
      height: var(--h-md);
      padding: 0 var(--s3);
      border: 1px solid var(--line);
      border-radius: var(--r2);
      background: var(--surface);
      font-size: 15px; color: var(--ink);
      transition: border-color var(--t-base), box-shadow var(--t-base);
    }
    .modal-input::placeholder { color: var(--ink-5); }
    .modal-input:focus {
      outline: none; border-color: var(--violeta);
      box-shadow: 0 0 0 3px var(--violeta-soft);
    }
    .modal-input--alias { text-transform: uppercase; }

    .modal-acciones { display: flex; flex-direction: column; gap: var(--s2); margin-top: var(--s5); }

    .btn-wa {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      width: 100%; min-height: var(--h-lg);
      background: #25D366; color: #fff;
      border: none; border-radius: 12px;
      font-size: 15.5px; font-weight: 600; cursor: pointer;
      box-shadow: 0 6px 18px -6px rgba(37, 211, 102, .5);
    }
    .btn-wa:hover:not(:disabled) { background: #1ebe5b; }
    .btn-wa:disabled { opacity: .6; cursor: not-allowed; box-shadow: none; }

    .btn-guardar {
      display: inline-flex; align-items: center; justify-content: center; gap: var(--s2);
      width: 100%; min-height: var(--h-md);
      background: var(--surface); color: var(--ink-2);
      border: 1px solid var(--line); border-radius: var(--r2);
      font-size: 14px; font-weight: 600; cursor: pointer;
    }
    .btn-guardar:hover:not(:disabled) { background: var(--surface-2); border-color: #cdd1d8; color: var(--ink); }
    .btn-guardar:disabled { opacity: .6; cursor: not-allowed; }

    /* ------------------------------------------- calculadora de cobro --- */
    /* Espejo exacto del modal de ingresoPedidoV2.css: el cajero ve la misma
       pieza en las dos pantallas. */
    .calc-destacado {
      background: #f5f2fb;
      border: 1px solid #e4dcf5;
      border-radius: var(--r2);
      padding: var(--s4);
      margin-bottom: var(--s5);
      text-align: center;
    }
    .calc-destacado-label {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-4); margin-bottom: var(--s1);
    }
    .calc-destacado-valor {
      font-size: 32px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1;
      color: var(--violeta);
    }
    .calc-input {
      width: 100%;
      height: var(--h-lg);
      padding: 0 var(--s4);
      border: 1.5px solid var(--line);
      border-radius: var(--r2);
      background: var(--surface);
      font-size: 20px; font-weight: 600; color: var(--ink);
      outline: none;
      transition: border-color var(--t-base), box-shadow var(--t-base);
    }
    .calc-input:focus { border-color: var(--violeta); box-shadow: 0 0 0 3px var(--violeta-soft); }

    .calc-resultado {
      display: none;
      border-radius: var(--r2);
      padding: var(--s4);
      margin-top: var(--s4);
      text-align: center;
    }
    .calc-resultado-vuelto { background: var(--verde-bg); border: 1px solid var(--verde-line); }
    .calc-resultado-falta  { background: var(--rojo-bg);  border: 1px solid var(--rojo-line); }
    .calc-resultado-label {
      font-size: 10px; font-weight: 700; letter-spacing: .1em;
      text-transform: uppercase; color: var(--ink-4); margin-bottom: var(--s1);
    }
    .calc-resultado-valor {
      font-size: 28px; font-weight: 700; letter-spacing: -.02em; line-height: 1.1;
    }
    .calc-resultado-vuelto .calc-resultado-valor { color: var(--verde); }
    .calc-resultado-falta  .calc-resultado-valor { color: var(--rojo); }

    /* ---------------------------------------------------------- responsive -- */
    /* Tablet apaisada y notebooks chicas: Nota se achica y los botones bajan un
       punto de tamaño antes que aparezca el scroll horizontal. */
    @media (max-width: 1200px) {
      .tabla th:nth-child(1) { width: 90px; }
      .tabla th:nth-child(3) { width: 15%; }
      .tabla th:nth-child(4) { width: 118px; }
      .tabla th:nth-child(5) { width: 124px; }
      .tabla th:nth-child(6) { width: 104px; }
      .tabla th:nth-child(7) { width: 198px; }
      .tabla th, .tabla td { padding-left: var(--s3); padding-right: var(--s3); }
      .icon-btn { width: 34px; height: 34px; }
      .acciones { gap: 6px; }
    }

    @media (max-width: 1000px) {
      .tabla th:nth-child(1) { width: 82px; }
      .tabla th:nth-child(3) { width: 14%; }
      .tabla th:nth-child(4) { width: 108px; }
      .tabla th:nth-child(5) { width: 112px; }
      .tabla th:nth-child(6) { width: 96px; }
      .tabla th:nth-child(7) { width: 180px; }
      .col-nota { font-size: 12.5px; }
      .icon-btn { width: 32px; height: 32px; }
      .icon-btn svg { width: 15px; height: 15px; }
      .acciones { gap: 5px; }
    }

    @media (max-width: 900px) {
      .pos-header { flex-wrap: wrap; gap: var(--s3); }
      .pos-indicadores { padding-left: 0; border-left: none; }
      main { padding: var(--s4) var(--s3) var(--s6); }
      .card-tabla-scroll { max-height: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
      button:active:not(:disabled), a.secondary:active, .icon-btn:active:not(:disabled) { transform: none; }
    }
  </style>
</head>
<body>
  <header class="pos-header">
    <div class="pos-brand">
      <img src="logo.png" alt="HomePoint" class="pos-logo">
      <div class="pos-titulo">
        <span class="pos-titulo-label">Historial</span>
        <span class="pos-titulo-valor">Pedidos del día</span>
      </div>
      <!-- Indicadores del día: se recalculan en cada render sobre el total
           descargado (no sobre el filtro), así el pulso del día no cambia al
           buscar un cliente. -->
      <div class="pos-indicadores">
        <div class="pos-ind">
          <span class="pos-ind-label">Pedidos</span>
          <span id="hdrPedidos" class="chip-hdr-valor">—</span>
        </div>
        <div class="pos-ind">

      </div>

    <nav class="pos-nav" aria-label="Secciones">

  <main>

          <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>

      </div>

    <section class="card-tabla" aria-label="Pedidos del día">

          <tbody id="pedidosBody">

          </tbody>
        </table>
      </div>
    </section>

    <div id="paginacion" class="paginacion"></div>
  </main>

  <!-- Modal WhatsApp Alias -->
  <div id="waModal" class="modal-overlay">
    <div class="modal-card modal-card-ancha">
      <div class="modal-head">
        <h3 class="modal-titulo">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" fill="#25D366" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592z"/></svg>

        </h3>

      <div class="modal-acciones">

          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.116.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.116-.198-.012-.304.087-.403.089-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.325-.336-.445-.342-.116-.007-.248-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.13 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.116-.943-.05-.084-.182-.133-.38-.232z"/></svg>
          Enviar WhatsApp
        </button>
        <button type="button" id="waBtnGuardar" class="btn-guardar" onclick="guardarDatosModal()">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 1a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4.5L11.5 1H2zm0-1h9.5L16 4.5V14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2z"/><path d="M3 4.5A1.5 1.5 0 0 1 4.5 3h5A1.5 1.5 0 0 1 11 4.5v2A1.5 1.5 0 0 1 9.5 8h-5A1.5 1.5 0 0 1 3 6.5v-2zM4.5 4a.5.5 0 0 0-.5.5v2a.5.5 0 0 0 .5.5h5a.5.5 0 0 0 .5-.5v-2a.5.5 0 0 0-.5-.5h-5z"/></svg>
          Guardar datos
        </button>
      </div>
    </div>
  </div>

  <!-- Modal Calculadora de Cobro -->
  <div id="calcModal" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-head">
        <h3 class="modal-titulo">
          <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#6c4eb6" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <rect x="5" y="2" width="14" height="20" rx="2"/><path d="M9 6h6"/>
            <path d="M9 11h.01M12 11h.01M15 11h.01M9 15h.01M12 15h.01M15 15h.01M9 19h.01M12 19h.01M15 19h.01"/>
          </svg>
          Calculadora de Cobro
        </h3>
        <button type="button" class="modal-cerrar" onclick="cerrarCalcCobro()" title="Cerrar" aria-label="Cerrar">&times;</button>
      </div>
      <div class="calc-destacado">
        <div class="calc-destacado-label">Total a cobrar</div>
        <div id="calcTotal" class="calc-destacado-valor">$0</div>
      </div>
      <div>
        <label for="calcAbona" class="modal-label">Abona el cliente</label>
        <input type="text" id="calcAbona" class="calc-input" inputmode="numeric" placeholder="Ingrese monto...">
      </div>
      <div id="calcVueltoContainer" class="calc-resultado calc-resultado-vuelto">
        <div class="calc-resultado-label">Vuelto</div>
        <div id="calcVuelto" class="calc-resultado-valor">$0</div>
      </div>
      <div id="calcFaltaContainer" class="calc-resultado calc-resultado-falta">
        <div class="calc-resultado-label">Falta</div>
        <div id="calcFalta" class="calc-resultado-valor">$0</div>
      </div>
    </div>
  </div>

  <script>
    // Cerrar modal con Escape y enviar con Enter
    document.addEventListener('keydown', function(e) {
      if (document.getElementById('waModal').style.display === 'flex') {
        if (e.key === 'Escape') cerrarModalWhatsapp();
        if (e.key === 'Enter' && document.activeElement.id === 'waAliasInput') enviarWhatsapp();
      }
    });
    // Cerrar modal al hacer clic fuera
    document.getElementById('waModal').addEventListener('click', function(e) {
      if (e.target === this) cerrarModalWhatsapp();
    });

    // === CALCULADORA DE COBRO ===
    // Misma mecánica que el modal de ingresoPedidoV2.html, pero el total no se
    // lee de un input del formulario sino del pedido cacheado de la fila.
    (function() {
      const overlay = document.getElementById('calcModal');
      const abonaInput = document.getElementById('calcAbona');
      const vueltoContainer = document.getElementById('calcVueltoContainer');
      const faltaContainer = document.getElementById('calcFaltaContainer');
      const vueltoEl = document.getElementById('calcVuelto');
      const faltaEl = document.getElementById('calcFalta');
      const totalEl = document.getElementById('calcTotal');
      let calcTotalFinal = 0;

      // Dígitos tipeados en el input ($12.500 -> 12500)
      function parseNumber(str) {
        if (!str) return 0;
        return parseInt(String(str).replace(/\D/g, ''), 10) || 0;
      }

      // totalFinal de Firebase puede venir como number o como string es-AR
      function parseTotalPedido(val) {
        if (val === null || val === undefined || val === '') return 0;
        if (typeof val === 'number') return Math.round(val);
        const clean = String(val).replace(/[^\d,.-]/g, '').replace(/\./g, '').replace(',', '.');
        const n = parseFloat(clean);
        return isNaN(n) ? 0 : Math.round(n);
      }

      function formatNumber(n) {
        return '$' + Math.round(n).toLocaleString('es-AR').replace(/,/g, '.');
      }

      function formatInputMiles(input) {
        const num = parseNumber(input.value);
        if (num > 0) {
          const pos = input.selectionStart;
          const lenAntes = input.value.length;
          input.value = '$' + num.toLocaleString('es-AR').replace(/,/g, '.');
          const lenDespues = input.value.length;
          input.setSelectionRange(pos + (lenDespues - lenAntes), pos + (lenDespues - lenAntes));
        } else {
          input.value = '';
        }
      }

      function abrirCalcCobro(id) {
        const pedido = pedidosCache[id];
        if (!pedido) { alert('Pedido no encontrado'); return; }
        calcTotalFinal = parseTotalPedido((pedido.pagos || {}).totalFinal);
        totalEl.textContent = formatNumber(calcTotalFinal);
        abonaInput.value = '';
        vueltoContainer.style.display = 'none';
        faltaContainer.style.display = 'none';
        overlay.style.display = 'flex';
        setTimeout(() => abonaInput.focus(), 100);
      }

      function cerrarCalcCobro() {
        overlay.style.display = 'none';
      }

      function calcularVuelto() {
        formatInputMiles(abonaInput);
        const abona = parseNumber(abonaInput.value);
        if (!abona) {
          vueltoContainer.style.display = 'none';
          faltaContainer.style.display = 'none';
          return;
        }
        const diff = abona - calcTotalFinal;
        if (diff >= 0) {
          vueltoEl.textContent = formatNumber(diff);
          vueltoContainer.style.display = 'block';
          faltaContainer.style.display = 'none';
        } else {
          faltaEl.textContent = formatNumber(Math.abs(diff));
          faltaContainer.style.display = 'block';
          vueltoContainer.style.display = 'none';
        }
      }

      overlay.addEventListener('click', function(e) {
        if (e.target === overlay) cerrarCalcCobro();
      });
      abonaInput.addEventListener('input', calcularVuelto);
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && overlay.style.display === 'flex') cerrarCalcCobro();
      });

      // Las filas de la tabla se generan con onclick inline: hace falta el global
      window.abrirCalcCobro = abrirCalcCobro;
      window.cerrarCalcCobro = cerrarCalcCobro;
    })();
  </script>
</body>
</html>
